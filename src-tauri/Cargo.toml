[package]
name = "neto"
version = "0.1.0"
description = "Neto: finanzas personales y modo autónomo"
edition = "2021"
publish = false

[lib]
name = "neto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
